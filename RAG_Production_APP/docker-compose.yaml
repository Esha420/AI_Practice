version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - rag_network

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    networks:
      - rag_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_app
    ports:
      - "8000:8000"   # FastAPI
      - "8288:8288"   # Inngest
      - "8501:8501"   # Streamlit
    env_file:
      - .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      REDIS_URL: "redis://redis:6379/0"

      # INGEST internal URLs (local inside one container)
      INNGEST_DEV: 1
      INNGEST_DEV_HOST: "http://localhost:8288"
      INNGEST_EVENT_API_URL: "http://localhost:8288/api/inngest"

      # BACKEND URL for Streamlit
      BACKEND_URL: "http://localhost:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    depends_on:
      - redis
      - qdrant
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge
